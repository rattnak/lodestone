name: Torture

# The long-running correctness sweep: thousands of deterministic chaos seeds
# plus the linearizability check. Too slow for every push, so it runs nightly
# and on demand. A failing seed is printed and reproducible locally.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Raft chaos sweep (5000 seeds)
        env:
          LODESTONE_CHAOS_SEEDS: "5000"
        run: go test -count=1 -timeout 25m -run TestExtendedChaos ./internal/raft/
      - name: Linearizability under faults (10 runs)
        run: go test -race -count=10 -run TestLinearizable ./internal/cluster/
